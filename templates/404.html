{% extends "base.html" %}

{% block title %}Page not found · {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="mx-auto max-w-xl px-4 py-24 text-center">
  <p class="text-sm font-semibold text-emerald-700 dark:text-emerald-400">404</p>
  <h1 class="mt-2 text-3xl font-bold tracking-tight">Page not found</h1>
  <p class="mt-4 text-stone-600 dark:text-stone-400">The page you're looking for doesn't exist or has moved.</p>
  <a href="{% url 'blog:post_list' %}" class="mt-8 inline-block rounded-lg bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-700">Back to the blog</a>
</section>
{% endblock %}
